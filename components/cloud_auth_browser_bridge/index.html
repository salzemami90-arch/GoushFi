<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Cloud Auth Browser Bridge</title>
  </head>
  <body>
    <script>
      const COMPONENT_READY = "streamlit:componentReady";
      const SET_COMPONENT_VALUE = "streamlit:setComponentValue";
      const SET_FRAME_HEIGHT = "streamlit:setFrameHeight";
      const RENDER = "streamlit:render";

      const Streamlit = {
        componentReady() {
          window.parent.postMessage(
            { isStreamlitMessage: true, type: COMPONENT_READY, apiVersion: 1 },
            "*",
          );
        },
        setComponentValue(value) {
          window.parent.postMessage(
            { isStreamlitMessage: true, type: SET_COMPONENT_VALUE, value },
            "*",
          );
        },
        setFrameHeight(height = 0) {
          window.parent.postMessage(
            { isStreamlitMessage: true, type: SET_FRAME_HEIGHT, height },
            "*",
          );
        },
      };

      let lastSentValue = null;

      function collectWindows() {
        const wins = [];
        let current = window;
        while (current) {
          if (!wins.includes(current)) {
            wins.push(current);
          }
          let nextWin = null;
          try {
            nextWin = current.parent && current.parent !== current ? current.parent : null;
          } catch (error) {
            nextWin = null;
          }
          if (!nextWin) break;
          current = nextWin;
        }
        try {
          if (window.top && !wins.includes(window.top)) {
            wins.push(window.top);
          }
        } catch (error) {}
        return wins;
      }

      function collectStorages() {
        return Array.from(
          new Set(
            collectWindows()
              .map((win) => {
                try {
                  return win && win.localStorage ? win.localStorage : null;
                } catch (error) {
                  return null;
                }
              })
              .filter(Boolean),
          ),
        );
      }

      function readStoredValue(storageName) {
        for (const storage of collectStorages()) {
          try {
            const value = String(storage.getItem(storageName) || "").trim();
            if (value) {
              return value;
            }
          } catch (error) {}
        }
        return "";
      }

      function writeStoredValue(storageName, value) {
        for (const storage of collectStorages()) {
          try {
            if (value) {
              storage.setItem(storageName, value);
            } else {
              storage.removeItem(storageName);
            }
          } catch (error) {}
        }
      }

      function getLocation(targetWin) {
        try {
          return targetWin && targetWin.location ? targetWin.location : null;
        } catch (error) {
          return null;
        }
      }

      function base64UrlEncode(text) {
        let bytes = [];
        try {
          bytes = Array.from(new TextEncoder().encode(text));
        } catch (error) {
          const encoded = unescape(encodeURIComponent(text));
          bytes = Array.from(encoded).map((char) => char.charCodeAt(0));
        }
        let binary = "";
        for (const byte of bytes) {
          binary += String.fromCharCode(byte);
        }
        return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
      }

      function base64UrlDecode(text) {
        const base64 = String(text || "").replace(/-/g, "+").replace(/_/g, "/");
        const padded = base64 + "=".repeat((4 - (base64.length % 4)) % 4);
        try {
          const binary = atob(padded);
          const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
          return new TextDecoder().decode(bytes);
        } catch (error) {
          try {
            return decodeURIComponent(escape(atob(padded)));
          } catch (nestedError) {
            return "";
          }
        }
      }

      function decodeJwtPayload(token) {
        try {
          const payloadPart = String(token || "").split(".")[1] || "";
          if (!payloadPart) {
            return {};
          }
          return JSON.parse(base64UrlDecode(payloadPart));
        } catch (error) {
          return {};
        }
      }

      function captureOAuthValue(storageName) {
        const sourceWin = collectWindows().find((targetWin) => {
          const loc = getLocation(targetWin);
          return loc && /(?:^#|&)refresh_token=/.test(String(loc.hash || ""));
        });

        if (!sourceWin) {
          return "";
        }

        const sourceLocation = getLocation(sourceWin);
        const hashValue = String((sourceLocation && sourceLocation.hash) || "").replace(/^#/, "");
        const params = new URLSearchParams(hashValue);
        const refreshToken = String(params.get("refresh_token") || "").trim();
        if (!refreshToken) {
          return "";
        }

        const claims = decodeJwtPayload(String(params.get("access_token") || "").trim());
        const encodedPayload = base64UrlEncode(
          JSON.stringify({
            email: String(claims.email || ""),
            user_id: String(claims.sub || ""),
            refresh_token: refreshToken,
          }),
        );
        writeStoredValue(storageName, encodedPayload);

        window.setTimeout(() => {
          try {
            const cleanUrl = `${sourceLocation.origin}${sourceLocation.pathname}${sourceLocation.search}`;
            sourceLocation.replace(cleanUrl);
          } catch (error) {
            try {
              sourceLocation.hash = "";
            } catch (nestedError) {}
          }
        }, 250);

        return encodedPayload;
      }

      function maybeSendValue(value) {
        const normalized = String(value || "");
        if (normalized === lastSentValue) {
          return;
        }
        lastSentValue = normalized;
        Streamlit.setComponentValue(normalized);
      }

      window.addEventListener("message", (event) => {
        if (!event.data || event.data.type !== RENDER) {
          return;
        }

        const args = event.data.args || {};
        const storageName = String(args.storageName || "floosy_cloud_auth_storage");
        const desiredValue = String(args.value || "");
        const action = String(args.action || "sync");

        if (action === "clear") {
          writeStoredValue(storageName, "");
        } else if (action === "capture_oauth") {
          maybeSendValue(captureOAuthValue(storageName));
          Streamlit.setFrameHeight(0);
          return;
        } else if (desiredValue) {
          writeStoredValue(storageName, desiredValue);
        }

        maybeSendValue(readStoredValue(storageName));
        Streamlit.setFrameHeight(0);
      });

      Streamlit.componentReady();
      Streamlit.setFrameHeight(0);
    </script>
  </body>
</html>
